server_name:
  type: string
  default: "Unser Minecraft-Server"
  description: "Name des Servers, der im Banner angezeigt wird."

banner_tagline:
  type: string
  default: "Willkommen in unserer Community – hier findest du News, Hilfe und Gleichgesinnte."
  description: "Kurzer Untertitel unter dem Servernamen."

server_ip:
  type: string
  default: "play.example.de"
  description: "Server-Adresse, die Spieler mit einem Klick kopieren können."

show_banner:
  type: bool
  default: true
  description: "Server-Banner auf der Startseite und den Themenlisten anzeigen."

show_player_count:
  type: bool
  default: true
  description: "Online-Status und Spielerzahl im Banner anzeigen (benötigt status_url)."

status_url:
  type: string
  default: ""
  description: "Adresse eures eigenen Status-Endpunkts (status.php aus dem Ordner server/), z. B. https://cubeside.de/forum/status.php. Leer = kein Status und keine Köpfe."

refresh_interval:
  type: integer
  default: 30
  min: 0
  max: 600
  description: "Spielerzahl und Köpfe automatisch alle X Sekunden aktualisieren (mindestens 10, 0 = aus). Pausiert, solange der Tab im Hintergrund ist."

show_player_heads:
  type: bool
  default: true
  description: "Köpfe aller Spieler, die gerade online sind, im Banner anzeigen. Die Namen kommen von eurem Status-Endpunkt (status_url)."

max_player_heads:
  type: integer
  default: 30
  min: 0
  max: 200
  description: "Maximale Anzahl angezeigter Köpfe (0 = alle). Weitere Spieler erscheinen als „+X“."

player_head_url:
  type: string
  default: "https://mineskin.eu/helm/{name}.png"
  description: "Bildquelle für die Köpfe. {name} wird durch den Spielernamen ersetzt."

player_link_url:
  type: string
  default: "https://stats.cubeside.de/player/{name}"
  description: "Ziel beim Klick auf einen Kopf. {name} wird durch den Spielernamen ersetzt. Leer = Köpfe sind nicht anklickbar."

banner_buttons:
  type: objects
  default: []
  description: "Buttons im Banner neben der Server-IP (z. B. Discord, Regeln, Shop). Reihenfolge per Drag & Drop."
  schema:
    name: "Button"
    identifier: label
    properties:
      label:
        type: string
        required: true
        validations:
          max_length: 40
      url:
        type: string
        required: true
        validations:
          max_length: 500
      icon:
        type: icon
      style:
        type: enum
        default: standard
        choices:
          - standard
          - hervorgehoben
      new_tab:
        type: boolean
        default: false
      groups:
        type: groups

show_team_online:
  type: bool
  default: true
  description: "Box „Team Online“ rechts neben der Themenliste anzeigen."

team_online_title:
  type: string
  default: "Team Online"
  description: "Überschrift der Box."

team_sections:
  type: objects
  default:
    - group: [1]
    - group: [2]
  description: "Gruppen in der Box „Team Online“. Reihenfolge per Drag & Drop. Wer in mehreren Gruppen ist, erscheint nur in der obersten. „Wer kann Mitglieder sehen“ muss in der Gruppe auf „Jeder“ stehen."
  schema:
    name: "Gruppe"
    identifier: title
    properties:
      group:
        type: groups
        required: true
        validations:
          min: 1
          max: 1
      title:
        type: string
        validations:
          max_length: 60

team_online_minutes:
  type: integer
  default: 5
  min: 1
  max: 60
  description: "Als online gilt, wer in den letzten X Minuten im Forum aktiv war."

team_online_keep_alive:
  type: bool
  default: true
  description: "Teammitglieder bleiben in der Box, solange sie das Forum in einem Tab offen haben – auch ohne Aktivität. Danach verschwinden sie nach team_online_minutes."

team_online_mobile:
  type: bool
  default: false
  description: "Box auch in der mobilen Ansicht anzeigen (dann über der Themenliste)."

show_online_users:
  type: bool
  default: true
  description: "Box „Gerade online“ in der Seitenleiste unter den Kategorien mit allen Nutzern, die gerade im Forum aktiv sind (nur für angemeldete Nutzer sichtbar)."

online_users_title:
  type: string
  default: "Gerade online"
  description: "Überschrift der Box."

online_users_minutes:
  type: integer
  default: 5
  min: 1
  max: 60
  description: "Als online gilt, wer in den letzten X Minuten im Forum aktiv war."

online_users_max:
  type: integer
  default: 30
  min: 0
  max: 200
  description: "Maximale Anzahl angezeigter Avatare (0 = alle). Weitere erscheinen als „+X“."

show_guest_popup:
  type: bool
  default: true
  description: "Nicht angemeldeten Besuchern ein Popup zeigen: registrieren, anmelden oder (für Nutzer aus dem alten Forum) ein neues Passwort anfordern."

guest_popup_title:
  type: string
  default: "Willkommen in unserem neuen Forum!"
  description: "Überschrift des Popups."

guest_popup_text:
  type: string
  default: "Registriere dich kostenlos, um mitzudiskutieren, Themen zu erstellen und keine News zu verpassen."
  description: "Text unter der Überschrift."

guest_popup_migration_text:
  type: string
  default: "Du hattest schon ein Konto in unserem alten Forum? Wir sind umgezogen – fordere einmal ein neues Passwort an, dann kannst du dich wie gewohnt anmelden."
  description: "Hinweis für Nutzer aus dem alten Forum, mit Button „Neues Passwort anfordern“. Leer lassen, um den Hinweis auszublenden."

guest_popup_delay_seconds:
  type: integer
  default: 5
  min: 0
  max: 120
  description: "Nach wie vielen Sekunden das Popup erscheint."

guest_popup_repeat_days:
  type: integer
  default: 7
  min: 0
  max: 365
  description: "Nach dem Schließen erst nach X Tagen wieder anzeigen (0 = bei jedem Besuch)."

sidebar_unread_link:
  type: bool
  default: true
  description: "In der Seitenleiste ganz oben einen Punkt „Ungelesene Beiträge“ mit Zähler anzeigen, sobald es neue Themen oder ungelesene Beiträge gibt."

sidebar_unread_mode:
  type: enum
  default: alle
  choices:
    - alle
    - verfolgt
  description: "alle = wie im alten Forum: alle Themen mit Beiträgen, die man noch nicht gelesen hat (ab dem ersten Besuch im neuen Forum). verfolgt = Discourse-Standard: neue Themen und ungelesene Antworten nur in verfolgten/beobachteten Themen."

sidebar_unread_link_text:
  type: string
  default: "Ungelesene Beiträge"
  description: "Beschriftung des Punkts in der Seitenleiste."

highlight_unread:
  type: bool
  default: true
  description: "Neues hervorheben: ungelesene Themen in den Listen, ungelesene Beiträge in Themen („Neu“), ungelesene Benachrichtigungen im Menü und den Zähler am Avatar. Gelesenes wird dezenter dargestellt."

corner_radius:
  type: integer
  default: 10
  min: 0
  max: 24
  description: "Eckenradius (px) für Karten, Buttons und Eingabefelder."

pixel_accent:
  type: bool
  default: true
  description: "Dezente Pixel-Kante (Gras-Block-Optik) unter dem Banner anzeigen."

svg_icons:
  type: list
  list_type: compact
  default: "copy|check|user-plus|key|right-to-bracket|bell|calendar-days|xmark|up-right-from-square"
  description: "Icons, die das Theme selbst verwendet (IP-Button, Gäste-Popup, Seitenleiste, Kalender). Icons der banner_buttons lädt Discourse automatisch."

calendar_url:
  type: string
  default: "https://cal.cubeside.de"
  description: "Adresse des Kalenders (cs-cal), ohne / am Ende. Leer = Kalender-Funktionen aus. Der Kalender bestimmt anhand der Forum-Gruppen selbst, wer welche Termine sieht."

calendar_groups:
  type: list
  list_type: group
  default: ""
  description: "Nur für Mitglieder dieser Gruppen Termine laden (Banner und „Nächste Termine“). Leer = für alle Angemeldeten; wer im Kalender keinen Zugriff hat, sieht dann einfach nichts."

calendar_team_link:
  type: string
  default: ""
  description: "Optional: Ziel beim Klick auf einen Termin in Banner/Box für das Team, z. B. ein Forum-Thema (/t/team-kalender/123). Leer = Kalender als Fenster im Forum öffnen (empfohlen)."

calendar_buddy_link:
  type: string
  default: ""
  description: "Wie calendar_team_link, aber für Buddies (Thema mit dem Buddy-Kalender)."

show_calendar_banner:
  type: bool
  default: true
  description: "Hinweis-Banner oben auf jeder Seite, wenn ein Termin bald beginnt. Lässt sich wegklicken."

show_calendar_sidebar_link:
  type: bool
  default: true
  description: "Punkt „Kalender“ in der Seitenleiste. Nur sichtbar für Nutzer mit Kalender-Zugriff; öffnet den Kalender als großes Fenster im Forum. Direktlink: /forum/#kalender"

calendar_sidebar_text:
  type: string
  default: "Kalender"
  description: "Beschriftung des Punkts in der Seitenleiste und Titel des Kalender-Fensters."

calendar_banner_hours:
  type: integer
  default: 24
  min: 1
  max: 168
  description: "So viele Stunden vor Beginn erscheint das Banner."

calendar_banner_categories:
  type: list
  list_type: compact
  default: "Saisonevent|Event|Mottomonat|Shop-Specials|Intern|Sonstiges"
  description: "Für welche Kalender-Kategorien das Banner erscheint. Leer = alle."

show_upcoming_events:
  type: bool
  default: true
  description: "Box „Nächste Termine“ rechts neben der Themenliste anzeigen (über „Team Online“)."

upcoming_events_title:
  type: string
  default: "Nächste Termine"
  description: "Überschrift der Box."

upcoming_events_count:
  type: integer
  default: 3
  min: 1
  max: 10
  description: "Wie viele Termine die Box zeigt."

upcoming_events_include_running:
  type: bool
  default: false
  description: "Auch Termine anzeigen, die schon laufen (z. B. Mottomonate). Aus = nur Termine, die noch nicht begonnen haben."

upcoming_events_mobile:
  type: bool
  default: false
  description: "Box auch in der mobilen Ansicht anzeigen (dann über der Themenliste)."
