server_name:
  type: string
  default: "Unser Minecraft-Server"
  description: "Name des Servers, der im Banner angezeigt wird."

banner_tagline:
  type: string
  default: "Willkommen in unserer Community – hier findest du News, Hilfe und Gleichgesinnte."
  description: "Kurzer Untertitel unter dem Servernamen."

server_ip:
  type: string
  default: "play.example.de"
  description: "Server-Adresse, die Spieler mit einem Klick kopieren können."

show_banner:
  type: bool
  default: true
  description: "Server-Banner auf der Startseite und den Themenlisten anzeigen."

show_player_count:
  type: bool
  default: true
  description: "Online-Status und Spielerzahl im Banner anzeigen (benötigt status_url)."

status_url:
  type: string
  default: ""
  description: "Adresse eures eigenen Status-Endpunkts (status.php aus dem Ordner server/), z. B. https://cubeside.de/forum/status.php. Leer = kein Status und keine Köpfe."

refresh_interval:
  type: integer
  default: 30
  min: 0
  max: 600
  description: "Spielerzahl und Köpfe automatisch alle X Sekunden aktualisieren (mindestens 10, 0 = aus). Pausiert, solange der Tab im Hintergrund ist."

show_player_heads:
  type: bool
  default: true
  description: "Köpfe aller Spieler, die gerade online sind, im Banner anzeigen. Die Namen kommen von eurem Status-Endpunkt (status_url)."

max_player_heads:
  type: integer
  default: 30
  min: 0
  max: 200
  description: "Maximale Anzahl angezeigter Köpfe (0 = alle). Weitere Spieler erscheinen als „+X“."

player_head_url:
  type: string
  default: "https://mineskin.eu/helm/{name}.png"
  description: "Bildquelle für die Köpfe. {name} wird durch den Spielernamen ersetzt."

player_link_url:
  type: string
  default: "https://stats.cubeside.de/player/{name}"
  description: "Ziel beim Klick auf einen Kopf. {name} wird durch den Spielernamen ersetzt. Leer = Köpfe sind nicht anklickbar."

banner_buttons:
  type: objects
  default: []
  description: "Buttons im Banner neben der Server-IP (z. B. Discord, Regeln, Shop). Reihenfolge per Drag & Drop."
  schema:
    name: "Button"
    identifier: label
    properties:
      label:
        type: string
        required: true
        validations:
          max_length: 40
      url:
        type: string
        required: true
        validations:
          max_length: 500
      icon:
        type: icon
      style:
        type: enum
        default: standard
        choices:
          - standard
          - hervorgehoben
      new_tab:
        type: boolean
        default: false

show_team_online:
  type: bool
  default: true
  description: "Box „Team Online“ rechts neben der Themenliste anzeigen."

team_online_title:
  type: string
  default: "Team Online"
  description: "Überschrift der Box."

team_sections:
  type: objects
  default:
    - group: [1]
    - group: [2]
  description: "Gruppen in der Box „Team Online“. Reihenfolge per Drag & Drop. Wer in mehreren Gruppen ist, erscheint nur in der obersten. „Wer kann Mitglieder sehen“ muss in der Gruppe auf „Jeder“ stehen."
  schema:
    name: "Gruppe"
    identifier: title
    properties:
      group:
        type: groups
        required: true
        validations:
          min: 1
          max: 1
      title:
        type: string
        validations:
          max_length: 60

team_online_minutes:
  type: integer
  default: 5
  min: 1
  max: 60
  description: "Als online gilt, wer in den letzten X Minuten im Forum aktiv war."

team_online_keep_alive:
  type: bool
  default: true
  description: "Teammitglieder bleiben in der Box, solange sie das Forum in einem Tab offen haben – auch ohne Aktivität. Danach verschwinden sie nach team_online_minutes."

team_online_mobile:
  type: bool
  default: false
  description: "Box auch in der mobilen Ansicht anzeigen (dann über der Themenliste)."

corner_radius:
  type: integer
  default: 10
  min: 0
  max: 24
  description: "Eckenradius (px) für Karten, Buttons und Eingabefelder."

pixel_accent:
  type: bool
  default: true
  description: "Dezente Pixel-Kante (Gras-Block-Optik) unter dem Banner anzeigen."

svg_icons:
  type: list
  list_type: compact
  default: "copy|check"
  description: "Icons für den IP-Button. Icons der banner_buttons lädt Discourse automatisch."
