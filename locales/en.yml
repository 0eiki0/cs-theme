en:
  theme_metadata:
    description: "A modern, minimal theme for Minecraft communities."
    settings:
      banner_buttons:
        description: "Buttons in the banner next to the server IP (e.g. Discord, rules, shop)."
        schema:
          properties:
            label:
              label: "Label"
              description: "Button text, e.g. “Discord”."
            url:
              label: "Link"
              description: "https://… or a forum path such as /t/rules/12."
            icon:
              label: "Icon"
              description: "Pick an icon – with preview and search (brand logos like Discord are found via search)."
            style:
              label: "Style"
              description: "standard = grey, hervorgehoben = green (highlighted)."
            new_tab:
              label: "Open in new tab"
            groups:
              label: "Visible to groups (optional)"
              description: "Empty = everyone sees the button. Otherwise only members of the selected groups. “everyone” = all, “logged_in_users” = all logged-in users, “anonymous_users” = guests only."
      team_sections:
        description: "Groups shown in the “Team Online” box. Reorder via drag & drop. Members of several groups only appear in the topmost one."
        schema:
          properties:
            group:
              label: "Group"
              description: "The group's “Who can see members” must be set to “Everyone”."
            title:
              label: "Heading (optional)"
              description: "Empty = the group's full name."
  banner:
    copy_ip: "Copy IP"
    copied: "Copied!"
    online: "Online"
    offline: "Offline"
    players: "%{count} / %{max} players"
    more_players: "%{count} more players"
  team_online:
    nobody: "No team members are online right now."
  online_users:
    error: "Could not load the list."
    count: "%{count} online"
  guest_popup:
    signup: "Sign up now"
    login: "I already have an account – log in"
    reset_password: "Request a new password"
    later: "Later"
  calendar:
    banner_label: "Coming up:"
    starts: "starts"
    dismiss: "Dismiss"
    today: "today"
    tomorrow: "tomorrow"
    on_date: "on %{date}"
    day_at_time: "%{day} at %{time}"
    all_day: "all day"
    until: "until %{date}"
    time_until: "%{time} until %{date}"
    running: "ongoing"
    none: "No upcoming events."
