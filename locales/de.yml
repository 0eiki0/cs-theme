de:
  theme_metadata:
    description: "Modernes, schlichtes Theme für Minecraft-Communities."
    settings:
      banner_buttons:
        description: "Buttons im Banner neben der Server-IP (z. B. Discord, Regeln, Shop)."
        schema:
          properties:
            label:
              label: "Beschriftung"
              description: "Text auf dem Button, z. B. „Discord“."
            url:
              label: "Link"
              description: "https://… oder ein Forenpfad wie /t/regeln/12."
            icon:
              label: "Icon"
              description: "Icon auswählen – mit Vorschau und Suche (Marken-Logos wie Discord findet ihr über die Suche)."
            style:
              label: "Stil"
              description: "standard = grau, hervorgehoben = grün."
            new_tab:
              label: "In neuem Tab öffnen"
            groups:
              label: "Sichtbar für Gruppen (optional)"
              description: "Leer = alle sehen den Button. Sonst nur Mitglieder der gewählten Gruppen. „jeder“ = alle, „angemeldete_benutzer“ = alle Angemeldeten, „anonyme_benutzer“ = nur Gäste."
      team_sections:
        description: "Gruppen in der Box „Team Online“. Reihenfolge per Drag & Drop. Wer in mehreren Gruppen ist, erscheint nur in der obersten."
        schema:
          properties:
            group:
              label: "Gruppe"
              description: "„Wer kann Mitglieder sehen“ muss in der Gruppe auf „Jeder“ stehen."
            title:
              label: "Überschrift (optional)"
              description: "Leer = vollständiger Name der Gruppe."
      embedded_pages:
        description: "Externe Seiten (z. B. das Webinterface), die sich wie der Kalender als Fenster im Forum öffnen."
        schema:
          properties:
            label:
              label: "Beschriftung"
              description: "Name in der Seitenleiste bzw. Tooltip des Buttons, z. B. „Webinterface“."
            url:
              label: "Adresse"
              description: "z. B. https://webinterface.cubeside.de/"
            icon:
              label: "Icon"
              description: "Icon für Seitenleiste und Kopfzeile. Leer = Pfeil-Symbol."
            position:
              label: "Wo anzeigen"
              description: "seitenleiste = Punkt in der Seitenleiste, kopfzeile = Button rechts oben neben Suche und Avatar, beides = beides."
            open_in:
              label: "Öffnen als"
              description: "fenster = großes Fenster im Forum (die Seite muss Einbetten erlauben), neuer_tab = in neuem Browser-Tab."
            groups:
              label: "Sichtbar für Gruppen (optional)"
              description: "Leer = alle Angemeldeten. Sonst nur Mitglieder der gewählten Gruppen. Blendet nur den Button aus – die Seite muss ihren Zugang selbst schützen."
  banner:
    copy_ip: "IP kopieren"
    copied: "Kopiert!"
    online: "Online"
    offline: "Offline"
    players: "%{count} / %{max} Spieler"
    more_players: "%{count} weitere Spieler"
  team_online:
    nobody: "Gerade ist niemand vom Team online."
  online_users:
    error: "Liste konnte nicht geladen werden."
    count: "%{count} online"
  guest_popup:
    signup: "Jetzt registrieren"
    login: "Ich habe schon ein Konto – anmelden"
    reset_password: "Neues Passwort anfordern"
    later: "Später"
  calendar:
    banner_label: "Bald geht's los:"
    starts: "startet"
    dismiss: "Ausblenden"
    today: "heute"
    tomorrow: "morgen"
    on_date: "am %{date}"
    day_at_time: "%{day} um %{time} Uhr"
    all_day: "ganztägig"
    until: "bis %{date}"
    time_until: "%{time} Uhr bis %{date}"
    running: "läuft"
    none: "Keine anstehenden Termine."
    title: "Kalender"
    open_new_tab: "In neuem Tab öffnen"
